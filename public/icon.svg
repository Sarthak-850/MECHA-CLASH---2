<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cyberRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect width="480" height="480" x="16" y="16" rx="90" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-opacity="0.3" />

  <!-- Outer Cyber Hexagon -->
  <polygon points="256,60 430,160 430,360 256,460 82,360 82,160" fill="#0b132b" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.6" filter="url(#glow)" />

  <!-- Mecha Visor & Horn Crest -->
  <path d="M256,100 L320,170 L380,180 L350,250 L400,280 L340,310 L256,400 L172,310 L112,280 L162,250 L132,180 L192,170 Z" fill="#1e293b" stroke="#06b6d4" stroke-width="5" />

  <!-- Glowing Visor (Cyan) -->
  <polygon points="170,260 256,290 342,260 330,230 256,245 182,230" fill="url(#cyberCyan)" filter="url(#glow)" />

  <!-- Center Energy Core -->
  <circle cx="256" cy="340" r="18" fill="#f43f5e" stroke="#ffe4e6" stroke-width="3" filter="url(#glow)" />

  <!-- Speed Slash Accent Lines -->
  <line x1="120" y1="130" x2="200" y2="150" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <line x1="392" y1="130" x2="312" y2="150" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" />
</svg>
